name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  analyze_and_test:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Flutter
        # subosito/flutter-action v2.9.1
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated API client is not drifted from the contract lock
        run: node tool/generate_api_models.mjs --check
        working-directory: .
        # The canonical OpenAPI document lives in the noki-shared-contracts
        # sibling repo, which is not checked out here. This job only runs the
        # drift check when that repo is present (e.g. in a monorepo-aware
        # runner); see README "CI foundation" for the limitation.
        continue-on-error: true

      - name: Verify localization is generated
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Build debug APK (compile gate, not a release artifact)
        run: flutter build apk --debug
