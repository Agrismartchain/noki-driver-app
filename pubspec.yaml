name: noki_driver_app
description: "NOKI Driver App - operational client for Delivery and Mobility drivers"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management: Riverpod (single paradigm across the app).
  # Chosen over Bloc/Provider/GetX because it removes BuildContext-coupled
  # global singletons, is fully testable via ProviderContainer overrides,
  # and needs no inherited-widget boilerplate. Used without code generation
  # (plain Notifier/Provider) to keep the build graph small and deterministic.
  flutter_riverpod: ^2.6.1

  # Routing: go_router is the Flutter-team-maintained declarative router,
  # supports redirects (used for the auth/role guard) and typed routes.
  go_router: ^15.1.2

  # HTTP: dio supports interceptors, connect/receive timeouts, headers,
  # cancellation tokens and structured error types out of the box.
  dio: ^5.7.0

  # Secure storage for access/refresh tokens (Android Keystore / iOS Keychain).
  # Never SharedPreferences for sensitive session data.
  flutter_secure_storage: ^9.2.2

  # Network reachability signal for the connectivity layer.
  connectivity_plus: ^6.1.3

  # Non-sensitive user preferences only (locale, theme mode). Never used for
  # session/token storage - see lib/core/storage/secure_session_storage.dart.
  shared_preferences: ^2.3.4

  # Platform intents only (tel:/geo:/maps URL) for the Call and Navigate
  # actions on Delivery/Mobility detail screens - no embedded map/routing SDK.
  url_launcher: ^6.3.1

  # Embedded map (DRIVER-APP-03): OpenStreetMap tiles via flutter_map - no
  # API key/billing account required (unlike google_maps_flutter/mapbox),
  # MIT-licensed, actively maintained. latlong2 is its LatLng dependency.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Device GPS position + built-in permission check/request API. Chosen over
  # a separate permission_handler package because geolocator already covers
  # the one permission family this app needs (location), avoiding two
  # overlapping permission plugins for the same capability.
  geolocator: ^13.0.2

  # QR camera scanning (DRIVER-APP-04) - MLKit-based, actively maintained;
  # the modern replacement for the now-unmaintained qr_code_scanner. Camera
  # permission is requested only when the scanner screen opens, never at
  # startup. Manual token entry (DeliveryQrEntryScreen) remains as a
  # fallback, not replaced.
  mobile_scanner: ^7.0.1

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Test doubles for the repository abstraction (auth/API failure injection).
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
