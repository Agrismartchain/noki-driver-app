name: noki_driver_app
description: "NOKI Driver App - operational client for Delivery and Mobility drivers"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management: Riverpod (single paradigm across the app).
  # Chosen over Bloc/Provider/GetX because it removes BuildContext-coupled
  # global singletons, is fully testable via ProviderContainer overrides,
  # and needs no inherited-widget boilerplate. Used without code generation
  # (plain Notifier/Provider) to keep the build graph small and deterministic.
  flutter_riverpod: ^2.6.1

  # Routing: go_router is the Flutter-team-maintained declarative router,
  # supports redirects (used for the auth/role guard) and typed routes.
  go_router: ^15.1.2

  # HTTP: dio supports interceptors, connect/receive timeouts, headers,
  # cancellation tokens and structured error types out of the box.
  dio: ^5.7.0

  # Secure storage for access/refresh tokens (Android Keystore / iOS Keychain).
  # Never SharedPreferences for sensitive session data.
  flutter_secure_storage: ^9.2.2

  # Network reachability signal for the connectivity layer.
  connectivity_plus: ^6.1.3

  # Non-sensitive user preferences only (locale, theme mode). Never used for
  # session/token storage - see lib/core/storage/secure_session_storage.dart.
  shared_preferences: ^2.3.4

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Test doubles for the repository abstraction (auth/API failure injection).
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
